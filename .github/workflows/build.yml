name: Build
on:
  push:
    branches: [patch-1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - run: |
          git clone --depth 1 --branch 3.1 https://github.com/Kr328/ZygoteLoader.git /tmp/zl
          cd /tmp/zl
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon
      - run: chmod +x gradlew
      - run: ./gradlew :freeform-server:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: |
            **/build/outputs/**/*.apk
            **/build/outputs/**/*.zip
